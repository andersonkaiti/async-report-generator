service: async-report-generator

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: sa-east-1

package:
  individually: true

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false

functions:
  hello:
    handler: src/functions/hello.handler
    events:
      - httpApi:
          path: /
          method: GET
