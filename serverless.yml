service: async-report-generator

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: sa-east-1
  memorySize: 128
  environment:
    LEADS_TABLE: !Ref LeadsTable
    GENERATE_REPORT_QUEUE_URL: !Ref GenerateReportQueue
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Scan
          Resource: !GetAtt LeadsTable.Arn
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !GetAtt GenerateReportQueue.Arn

package:
  individually: true

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false

functions:
  populateDynamo:
    handler: src/functions/populate-dynamo.handler
    timeout: 25
    memorySize: 1024
    events:
      - httpApi:
          path: /populate-dynamo
          method: POST
  generateReport:
    handler: src/functions/generate-report.handler
    events:
      - httpApi:
          path: /generate-report
          method: POST

resources:
  Resources:
    LeadsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: leads_table
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - KeyType: HASH
            AttributeName: id
        BillingMode: PAY_PER_REQUEST
    
    GenerateReportQueue: 
      Type: AWS::SQS::Queue
      Properties:
        QueueName: generate_report_queue
        ReceiveMessageWaitTimeSeconds: 20
        VisibilityTimeout: 180 # 60 seconds * 3
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt GenerateReportDLQ.Arn
          maxReceiveCount: 2
    
    GenerateReportDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: generate_report_dlq
        MessageRetentionPeriod: 1209600 # 14 days in seconds
