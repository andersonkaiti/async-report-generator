service: async-report-generator

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: sa-east-1
  environment:
    LEADS_TABLE: !Ref LeadsTable
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Scan
          Resource: !GetAtt LeadsTable.Arn

package:
  individually: true

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false

functions:
  populateDynamo:
    handler: src/functions/populate-dynamo.handler
    timeout: 25
    events:
      - httpApi:
          path: /populate-dynamo
          method: POST

resources:
  Resources:
    LeadsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: leads_table
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - KeyType: HASH
            AttributeName: id
        BillingMode: PAY_PER_REQUEST
