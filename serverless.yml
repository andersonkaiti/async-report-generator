service: async-report-generator

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: sa-east-1
  environment:
    LEADS_TABLE: !Ref LeadsTable

package:
  individually: true

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false

functions:
  hello:
    handler: src/functions/hello.handler
    events:
      - httpApi:
          path: /
          method: GET

resources:
  Resources:
    LeadsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: leads_table
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - KeyType: HASH
            AttributeName: id
        BillingMode: PAY_PER_REQUEST
