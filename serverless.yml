service: async-report-generator

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: sa-east-1
  memorySize: 128
  environment:
    LEADS_TABLE: !Ref LeadsTable
    GENERATE_REPORT_QUEUE_URL: !Ref GenerateReportQueue
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Scan
          Resource: !GetAtt LeadsTable.Arn
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !GetAtt GenerateReportQueue.Arn

package:
  individually: true

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false

functions:
  populateDynamo:
    handler: src/functions/http/populate-dynamo.handler
    timeout: 25
    memorySize: 1024
    events:
      - httpApi:
          path: /populate-dynamo
          method: POST
  generateReport:
    handler: src/functions/http/generate-report.handler
    events:
      - httpApi:
          path: /generate-report
          method: POST

resources:
  - ${file(./resources/leads-table.yml)}
  - ${file(./resources/generate-report-queue.yml)}
  - ${file(./resources/reports-bucket.yml)}
